# Drop-in instalado em /etc/systemd/system/<unidade>.service.d/claude-token.conf
# nas rotinas que chamam o Claude: reforma-ciclo, painel-instagram-coleta,
# painel-instagram-hora e robo-comentarios-analise.
# Entrega a chave de 1 ano (claude setup-token, gravada por
# scripts/salvar_token_claude.sh). O "-" deixa a rotina rodar sem ela (usa o
# login comum). CLAUDE_CODE_OAUTH_TOKEN vale antes do login comum.
[Service]
EnvironmentFile=-/home/rodrigo/.config/claude-token/token.env
