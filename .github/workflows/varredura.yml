name: Varredura Reforma Tributária

on:
  schedule:
    # Plano B: a coleta primária agora roda no notebook lenovo-claude, no
    # ciclo das 05:00 e das 17:00 Brasília (systemd, ver
    # docs/operacao-local.md). Este workflow só age como rede de segurança,
    # ~2h40 depois do ciclo matinal — 10:40 UTC = 07:40 Brasília, todo dia (não só dia útil, porque fontes publicam fim de
    # semana também) — e só coleta de verdade se dados/AAAA-MM-DD.json ainda
    # não existir (ver "Verificar se já varreu hoje" abaixo). O minuto (:10)
    # é de propósito fora do início exato da hora — ver comentário
    # equivalente em dou.yml sobre o incidente de 27-28/08.
    - cron: "40 10 * * *"
  workflow_dispatch:        # permite disparar na mão pela aba Actions
  push:
    # Só estado.json (edição manual da camada curada, às vezes pelo site do
    # GitHub). Análises, dados e scripts não disparam mais: o notebook
    # regenera o painel em todo ciclo, e a regeneração duplicada aqui
    # competia com ele pelo docs/index.html — derrubou o primeiro ciclo
    # novo em 30/09/2026 com conflito de rebase.
    paths:
      - "estado.json"       # editou a camada curada? regenera o painel

permissions:
  contents: write           # necessário para o commit dos dados

concurrency:
  group: varredura
  cancel-in-progress: false

jobs:
  varrer:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Verificar se já varreu hoje
        id: checar
        if: github.event_name == 'schedule'
        run: |
          hoje=$(date -u +%F)
          if [ -f "dados/${hoje}.json" ]; then
            echo "ja_rodou=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja_rodou=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Varrer fontes oficiais
        id: varrer
        # push só precisa regenerar o painel, não re-varrer. Em "schedule",
        # só varre se o arquivo do dia ainda não existe (ver cron acima) —
        # workflow_dispatch sempre força, para permitir re-rodar na mão.
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.checar.outputs.ja_rodou != 'true')
        env:
          # Sem estes secrets a varredura roda igual: o DOU e' pulado e aparece
          # como fonte sem credencial. As 12 fontes web nao dependem disto.
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: python scripts/varredura.py
        continue-on-error: true      # fonte fora do ar não derruba a execução

      - name: Gerar painel
        run: python scripts/gerar_painel.py

      - name: Commit dos resultados
        run: |
          git config user.name  "varredura-bot"
          git config user.email "actions@github.com"
          git add dados docs
          if git diff --staged --quiet; then
            echo "Nada mudou hoje."
          else
            git commit -m "varredura $(date -u +%Y-%m-%d)"
            # Pull/rebase contra a branch atual (nao "origin main" fixo): o
            # checkout ja rastreia a branch certa, e fixar em main quebra
            # quando o workflow roda numa branch de PR com commits que main
            # ainda nao tem.
            git pull --rebase --autostash -q && git push || ( sleep 5 && git pull --rebase --autostash -q && git push )
          fi

      - name: Resumo da execução
        if: always()
        run: |
          echo "### Varredura $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib
          p = pathlib.Path("dados/novidades.json")
          if not p.exists():
              print("Sem arquivo de novidades — a varredura falhou.")
          else:
              d = json.loads(p.read_text("utf-8"))
              print(f"**{d['quantidade']} novidade(s).**\n")
              for i in d["itens"][:20]:
                  print(f"- [{i['titulo'][:120]}]({i['url']}) — {i['fonte']}")
              if d["fontes_com_erro"]:
                  print(f"\n**Fontes com erro:** {', '.join(d['fontes_com_erro'])}")
              if d["fontes_sem_itens"]:
                  print(f"\n**Sem itens relevantes:** {', '.join(d['fontes_sem_itens'])}")
          PY

      # Mantém o agendamento vivo: o GitHub desativa workflows agendados
      # em repositório público após 60 dias sem atividade no repositório.
      - name: Sinal de vida
        run: |
          date -u +%F > .keepalive
          git add .keepalive
          git commit -m "keepalive" --allow-empty -q
          git pull --rebase --autostash -q && git push -q || true
