name: DOU (INLABS)

# Separado da Varredura Reforma Tributária de proposito: roda mais cedo
# (01:07 Brasília) para não concorrer por horário com os outros 12 portais
# (02:10) nem com o catch-up (03:15), e tem orçamento de tempo próprio — o
# login do INLABS pode levar até 30 tentativas com espera crescente (até
# 120s cada) para superar manutenção programada.
on:
  schedule:
    # Plano B: a coleta primária do DOU agora roda no notebook lenovo-claude,
    # todo dia às 01:07 Brasília (systemd timer, ver docs/operacao-local.md).
    # Este workflow só age como rede de segurança, 3h depois — 07:10 UTC =
    # 04:10 Brasília, todo dia — e só coleta de verdade se
    # dados/AAAA-MM-DD-dou.json ainda não existir (ver "Verificar se já
    # coletou hoje" abaixo). Fora do início exato da hora de propósito: o
    # GitHub documenta que "high load times include the start of each hour",
    # e um cron pode atrasar ou ser pulado silenciosamente nesses horários —
    # foi o que aconteceu em 27-28/08/2026.
    - cron: "10 7 * * *"
  workflow_dispatch:        # permite disparar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: dou
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verificar se já coletou hoje
        id: checar
        if: github.event_name == 'schedule'
        run: |
          hoje=$(date -u +%F)
          if [ -f "dados/${hoje}-dou.json" ]; then
            echo "ja_rodou=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja_rodou=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Coletar DOU (INLABS)
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && steps.checar.outputs.ja_rodou != 'true')
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: python scripts/dou_diario.py

      - name: Commit dos resultados
        run: |
          git config user.name  "dou-bot"
          git config user.email "actions@github.com"
          git add dados
          if git diff --staged --quiet; then
            echo "Nada mudou hoje."
          else
            git commit -m "dou $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash -q && git push || ( sleep 5 && git pull --rebase --autostash -q && git push )
          fi

      - name: Resumo da execução
        if: always()
        run: |
          echo "### DOU $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib, datetime
          hoje = datetime.date.today().isoformat()
          p = pathlib.Path(f"dados/{hoje}-dou.json")
          if not p.exists():
              print("Sem arquivo de resultado — a coleta falhou antes de gravar.")
          else:
              d = json.loads(p.read_text("utf-8"))
              f = d["fontes"][0]
              print(f"**{f['total']} item(ns).**\n")
              if f.get("erro"):
                  print(f"Erro: {f['erro']}")
          PY
