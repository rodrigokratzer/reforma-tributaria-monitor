name: DOU (INLABS)

# Separado da Varredura Reforma Tributária de proposito: roda mais cedo
# (02:00 Brasília) para não concorrer por horário com os outros 12 portais
# às 06:40, e tem orçamento de tempo próprio — o login do INLABS pode levar
# até 30 tentativas com espera crescente (até 120s cada) para superar
# manutenção programada.
on:
  schedule:
    # Fora do início exato da hora de propósito: o GitHub documenta que
    # "high load times include the start of each hour", e um cron pode
    # atrasar ou ser pulado silenciosamente nesses horários — foi o que
    # aconteceu em 27-28/08/2026, quando o agendamento parou de disparar
    # por dois dias seguidos sem erro nenhum.
    - cron: "7 5 * * 1-5"   # 05:07 UTC ~= 02:07 Brasília, dias úteis
  workflow_dispatch:        # permite disparar na mão pela aba Actions

permissions:
  contents: write

concurrency:
  group: dou
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Coletar DOU (INLABS)
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: python scripts/dou_diario.py

      - name: Commit dos resultados
        run: |
          git config user.name  "dou-bot"
          git config user.email "actions@github.com"
          git add dados
          if git diff --staged --quiet; then
            echo "Nada mudou hoje."
          else
            git commit -m "dou $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash -q && git push || ( sleep 5 && git pull --rebase --autostash -q && git push )
          fi

      - name: Resumo da execução
        if: always()
        run: |
          echo "### DOU $(date -u +%F)" >> $GITHUB_STEP_SUMMARY
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib, datetime
          hoje = datetime.date.today().isoformat()
          p = pathlib.Path(f"dados/{hoje}-dou.json")
          if not p.exists():
              print("Sem arquivo de resultado — a coleta falhou antes de gravar.")
          else:
              d = json.loads(p.read_text("utf-8"))
              f = d["fontes"][0]
              print(f"**{f['total']} item(ns).**\n")
              if f.get("erro"):
                  print(f"Erro: {f['erro']}")
          PY
