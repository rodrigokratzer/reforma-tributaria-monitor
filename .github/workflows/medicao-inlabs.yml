name: Medicao INLABS (DOU completo)

# Tenta sozinha todo dia as 05h de Brasilia (08:00 UTC), duas horas antes do
# e-mail das 07h. O INLABS esta' devolvendo 502 no login; quando voltar, esta
# medicao roda sem ninguem olhando.
#
# Para de tentar sozinha assim que houver um relatorio: o primeiro passo
# verifica se dados/medicao_inlabs.json ja' existe e, se existir, pula o resto.
# Para refazer de proposito, dispare a mao marcando "forcar".
on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      inicio:
        description: "Data inicial AAAA-MM-DD"
        required: false
        default: "2026-07-27"
      fim:
        description: "Data final AAAA-MM-DD (vazio = hoje)"
        required: false
        default: ""
      forcar:
        description: "Refazer mesmo se ja' houver medicao (sim/nao)"
        required: false
        default: "nao"

permissions:
  contents: write

concurrency:
  group: medicao-inlabs
  cancel-in-progress: false

jobs:
  medir:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Ja existe medicao?
        id: check
        run: |
          if [ -f dados/medicao_inlabs.json ] && [ "${{ github.event.inputs.forcar }}" != "sim" ]; then
            echo "rodar=nao" >> $GITHUB_OUTPUT
            echo "Medicao ja concluida em dados/medicao_inlabs.json. Nada a fazer."
            echo "Medicao ja concluida — este agendamento pode ser removido." >> $GITHUB_STEP_SUMMARY
          else
            echo "rodar=sim" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.rodar == 'sim'
        with:
          python-version: "3.12"

      - name: Medir sobre a edicao completa do DOU
        if: steps.check.outputs.rodar == 'sim'
        continue-on-error: true
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: |
          if [ -z "$INLABS_EMAIL" ] || [ -z "$INLABS_SENHA" ]; then
            echo "::error::Secrets INLABS_EMAIL e INLABS_SENHA nao estao definidos."
            exit 1
          fi
          python scripts/medir_inlabs.py \
            "${{ github.event.inputs.inicio || '2026-07-27' }}" \
            "${{ github.event.inputs.fim || '' }}"

      - name: Relatorio
        if: steps.check.outputs.rodar == 'sim'
        run: |
          python - <<'PY' >> $GITHUB_STEP_SUMMARY
          import json, pathlib, sys
          p = pathlib.Path("dados/medicao_inlabs.json")
          if not p.exists():
              # Verde so' quando houve resultado. Sem isto, o continue-on-error do
              # passo anterior faz o job reportar sucesso sem ter medido nada.
              print("A medicao nao gerou relatorio. Ver o log do passo 'Medir'.")
              print("Causa mais provavel hoje: o login do INLABS responde 502.")
              sys.stderr.write("::error::Medicao sem relatorio — job marcado como falha.\n")
              raise SystemExit(1)
          d = json.loads(p.read_text("utf-8"))
          print("## Medicao INLABS — DOU completo\n")
          print(f"Janela {d['janela'][0]} a {d['janela'][1]} · **{d['materias_lidas']} materias** em {d['dias_uteis']} dias uteis\n")
          print("### Recall\n")
          print(f"Corpus indexado: **{d.get('corpus_indexado', 0)}** materias, incluindo as descartadas.\n")
          print("| Ato esperado | DOU | Situacao | Balde | Onde |")
          print("|---|---|---|---|---|")
          ICONE = {"encontrado": "OK", "descartado pelo filtro": "**FILTRO DESCARTOU**",
                   "ausente do corpus": "**AUSENTE DA COLETA**", "fora da janela": "fora da janela"}
          for r in d["recall"]:
              onde = f"{r['dia']} {r['secao']}" if r.get("encontrado") else "-"
              print(f"| {r['esperado']} | {r.get('data_dou','?')} | {ICONE.get(r['situacao'], r['situacao'])} | {r.get('balde') or '-'} | {onde} |")
          escopo = d.get("esperados_no_escopo", 0)
          ausentes = sum(1 for r in d["recall"] if r["situacao"] == "ausente do corpus")
          filtrados = sum(1 for r in d["recall"] if r["situacao"] == "descartado pelo filtro")
          fracos = sum(1 for r in d["recall"] if r.get("balde") == "revisar")
          if escopo == 0:
              v = "INCONCLUSIVO — nenhum ato do gabarito caiu nesta janela. Rode a partir de 2026-07-29."
          elif ausentes:
              v = f"REPROVADO — {ausentes} ato(s) nao apareceram no corpus. Falha de COLETA."
          elif filtrados:
              v = f"REPROVADO — {filtrados} ato(s) coletados e descartados pelo FILTRO. Falha de regra."
          elif fracos:
              v = f"APROVADO com ressalva — {fracos} ato(s) so em 'revisar'"
          else:
              v = "APROVADO"
          print(f"\n**Veredito:** {v}\n")
          print("### Volume\n")
          print(f"- forte: **{d['forte']}** ({d['forte_por_dia']}/dia util)")
          print(f"- revisar: **{d['revisar']}** ({d['revisar_por_dia']}/dia util)")
          print(f"- descartado: **{d['descartado']}**")
          if d["falhas"]:
              print(f"\n**{len(d['falhas'])} download(s) com erro.** 1o: `{d['falhas'][0]}`")
          print("\n### Balde forte — o que iria para o e-mail\n")
          for i in d["amostra_forte"]:
              print(f"- `{i['dia']} {i['secao']}` **{i['titulo']}** — {i['orgao']}")
          print("\n### Balde revisar\n")
          for i in d["amostra_revisar"]:
              print(f"- `{i['dia']} {i['secao']}` {i['titulo']} — {i['orgao']}")
          PY

      - name: Commit do relatorio
        if: steps.check.outputs.rodar == 'sim'
        run: |
          git config user.name  "medicao-bot"
          git config user.email "actions@github.com"
          git add dados/medicao_inlabs.json || true
          git diff --staged --quiet || (git commit -m "medicao INLABS" && git push)
